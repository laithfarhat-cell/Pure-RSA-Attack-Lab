[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pure-rsa-lab"
version = "0.1.0"
description = "A transparent RSA, OAEP, and defensive parameter-review laboratory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.7,<16"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
rsa-lab = "cli.lab_cli:main"

[tool.setuptools]
packages = ["core", "attacks", "cli"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
